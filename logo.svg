<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGradient)" />
  
  <!-- Inner circle -->
  <circle cx="100" cy="100" r="70" fill="none" stroke="white" stroke-width="3" opacity="0.3" />
  
  <!-- Code brackets -->
  <path d="M60 70 L40 100 L60 130" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M140 70 L160 100 L140 130" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Central diamond -->
  <polygon points="100,80 120,100 100,120 80,100" fill="white" opacity="0.9" />
  
  <!-- Inner dot -->
  <circle cx="100" cy="100" r="8" fill="url(#logoGradient)" />
  
  <!-- Company initials -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="white">WD</text>
</svg>